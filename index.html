<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Auto Absen SARAHmart</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(145deg,#fff8d8,#fff,#fff3c4);color:#333;padding:10px}
.app{width:100%;max-width:480px;margin:auto}
.clock-card,.result-card,.history,.stat{background:#fff;border-radius:18px;box-shadow:0 4px 15px #0000000d}
.clock-card{text-align:center;padding:8px;margin-bottom:10px}.clock{font-size:16px;font-weight:bold;color:#ed9200}.date{font-size:12px;color:#777;margin-top:3px}
.camera-card{background:#171717;border-radius:21px;padding:10px;box-shadow:0 7px 20px #0004}.camera-title{color:#fff;font-weight:bold;font-size:14px;padding:3px 0 8px}.video-wrap{position:relative}
video{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:15px;background:#000;border:3px solid #555}
.scan-line{position:absolute;left:5%;right:5%;height:3px;background:#ffe000;box-shadow:0 0 12px #ffe000;top:10%;animation:scan 2.2s infinite;border-radius:5px}
@keyframes scan{0%{top:10%}50%{top:88%}100%{top:10%}}
.camera-status{margin-top:8px;padding:9px;border-radius:10px;background:#282828;color:#ddd;text-align:center;font-size:12px}
.btn-start{width:100%;padding:12px;margin-top:8px;border:0;border-radius:12px;background:linear-gradient(135deg,#ffd000,#ff9800);color:#fff;font-weight:bold;font-size:14px;cursor:pointer}
.btn-start:active{transform:scale(0.98)}
.btn-start:disabled{background:#555;color:#888;cursor:not-allowed}
.result-card{margin-top:10px;padding:15px;text-align:center}.result-icon{width:58px;height:58px;margin:auto;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;font-size:27px}
.result-name{font-size:21px;font-weight:bold;margin-top:8px}.result-status{display:inline-block;margin-top:7px;padding:6px 13px;border-radius:20px;background:#eee;color:#666;font-size:12px;font-weight:bold}
.success{background:#e7fff0!important;color:#139447!important}.warning{background:#fff3d0!important;color:#b87500!important}.error{background:#ffe8e8!important;color:#d52222!important}.info{background:#e8f2ff!important;color:#2671c9!important}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.stat{text-align:center;padding:12px}.stat-number{font-size:23px;font-weight:bold;color:#ed9200}.stat-label{font-size:11px;color:#777;margin-top:3px}
.history{margin-top:10px;padding:14px}.history-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.history-header h3{font-size:16px}.refresh{border:0;background:#fff1bf;color:#a66b00;border-radius:9px;padding:6px 9px}
.item{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #eee}.item:last-child{border:0}.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#ffd000,#ff9800);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold}.item-info{flex:1;text-align:left}.item-name{font-size:13px;font-weight:bold}.item-time{font-size:10px;color:#888;margin-top:2px}.badge{font-size:9px;background:#e7fff0;color:#159447;padding:5px 7px;border-radius:15px}.empty{text-align:center;color:#999;padding:18px 5px;font-size:12px}
.footer{text-align:center;font-size:10px;color:#999;padding:15px 0 5px}
.loading{position:fixed;inset:0;background:#000b;z-index:99;display:flex;align-items:center;justify-content:center}.loading-box{background:#fff;padding:23px;border-radius:18px;text-align:center;width:80%;max-width:280px}.spinner{width:42px;height:42px;border:5px solid #eee;border-top-color:#ffae00;border-radius:50%;animation:spin 1s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}.hidden{display:none!important}
</style>
</head>
<body>
<div id="loading" class="loading"><div class="loading-box"><div class="spinner"></div><h3 style="margin-top:13px">Menyiapkan Sistem</h3><p id="loadingText" style="font-size:11px;color:#777;margin-top:5px">Memuat AI...</p></div></div>
<div class="app">
<div class="clock-card"><div id="clock" class="clock">00:00:00</div><div id="date" class="date">Memuat tanggal...</div></div>

<div class="camera-card">
  <div class="camera-title">📷 Kamera Absensi</div>
  <div class="video-wrap">
    <video id="video" autoplay muted playsinline></video>
    <div class="scan-line"></div>
  </div>
  <button id="btnStartCamera" class="btn-start" onclick="startCamera()" disabled>⏳ Memeriksa Syarat Lokasi & Jam...</button>
  <div id="cameraStatus" class="camera-status">⏳ Memeriksa lokasi GPS dan jam absensi...</div>
</div>

<div class="result-card"><div id="resultIcon" class="result-icon">👤</div><div id="namaDetek" class="result-name">Menunggu syarat terpenuhi...</div><div id="resultStatus" class="result-status">Validasi lokasi & waktu aktif</div></div>
<div class="stats"><div class="stat"><div id="totalKaryawan" class="stat-number">0</div><div class="stat-label">Karyawan Terdaftar</div></div><div class="stat"><div id="totalAbsen" class="stat-number">0</div><div class="stat-label">Absen Hari Ini</div></div></div>
<div class="history"><div class="history-header"><h3>📋 Riwayat Hari Ini</h3><button class="refresh" onclick="loadHistory()">↻ Refresh</button></div><div id="historyList"><div class="empty">Belum ada absensi hari ini</div></div></div>
<div class="footer">SARAHmart • Sistem Auto Absen</div>
</div>
<script>
const db=supabase.createClient('https://fbxfoorzeojsqnzcmvic.supabase.co','sb_publishable_Xg3DLbSsRFTsU5ZjxIylkA_JP6pUpSK');
const SUPABASE_URL = 'https://fbxfoorzeojsqnzcmvic.supabase.co';
const FOTO_DEFAULT = `${SUPABASE_URL}/storage/v1/object/public/absen-foto/default.jpg`;
const video=document.getElementById('video');
let labeledDescriptors=[],dataKaryawan=[],isScanning=false,lastDetectedName='',lastAttendanceTime=0;
let blinkClosed=false,blinkStart=0,livenessName='',livenessReady=false,cameraOn=false;
let activeTipeAbsen = null; // KUNCI BARU: LOCK TIPE ABSEN
const COOLDOWN=10000;

// Konfigurasi Syarat Baru
const TARGET_LAT = -6.8878247;
const TARGET_LNG = 112.4560587;
const MAX_RADIUS = 100; // dalam meter

function updateClock(){
 const n=new Date();
 document.getElementById('clock').textContent=n.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
 document.getElementById('date').textContent=n.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 if(!cameraOn) checkConditions(); // HANYA CEK JIKA KAMERA BELUM ON
}
setInterval(updateClock,1000);updateClock();

function setLoading(t){document.getElementById('loadingText').textContent=t}
function setResult(name,status,icon,text){
 document.getElementById('namaDetek').textContent=name;
 document.getElementById('resultIcon').textContent=icon;
 const e=document.getElementById('resultStatus');
 e.className='result-status '+status;e.textContent=text;
}

// Hitung Jarak Haversine (dalam meter)
function calculateDistance(lat1, lon1, lat2, lon2) {
 const R = 6371e3;
 const dLat = (lat2 - lat1) * Math.PI / 180;
 const dLon = (lon2 - lon1) * Math.PI / 180;
 const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
           Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
           Math.sin(dLon/2) * Math.sin(dLon/2);
 const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
 return R * c;
}

// Periksa Jam Absensi
function getAbsenTypeByTime() {
 const now = new Date();
 const hours = now.getHours();
 const minutes = now.getMinutes();
 const currentTimeVal = hours * 60 + minutes;

 const masukStart = 6 * 60 + 30; // 06:30
 const masukEnd = 7 * 60 + 30; // 07:30
 const pulangStart = 20 * 60; // 20:00
 const pulangEnd = 21 * 60; // 21:00

 if (currentTimeVal >= masukStart && currentTimeVal <= masukEnd) {
  return 'masuk';
 } else if (currentTimeVal >= pulangStart && currentTimeVal <= pulangEnd) {
  return 'pulang';
 }
 return null;
}

// Validasi Gabungan (Jam & Lokasi)
async function checkConditions() {
 const btn = document.getElementById('btnStartCamera');
 const statusEl = document.getElementById('cameraStatus');

 // 1. Cek Jam Terlebih Dahulu
 const tipeAbsen = getAbsenTypeByTime();
 if (!tipeAbsen) {
  btn.disabled = true;
  btn.textContent = '⛔ Diluar Jam Absen';
  statusEl.textContent = '❌ Jam absen aktif: 06:30-07:30 (Masuk) & 20:00-21:00 (Pulang)';
  return;
 }

 // 2. Cek GPS / Lokasi
 if (!navigator.geolocation) {
  btn.disabled = true;
  statusEl.textContent = '🔴 Perangkat tidak mendukung GPS';
  return;
 }

 navigator.geolocation.getCurrentPosition(
  (position) => {
   const userLat = position.coords.latitude;
   const userLng = position.coords.longitude;
   const distance = calculateDistance(userLat, userLng, TARGET_LAT, TARGET_LNG);

   if (distance <= MAX_RADIUS) {
    btn.disabled = false;
    btn.textContent = `▶️ KLIK UNTUK MULAI KAMERA (${tipeAbsen.toUpperCase()})`;
    statusEl.textContent = `🟢 Lokasi Valid (${Math.round(distance)}m) & Jam Sesuai. Silahkan mulai!`;
   } else {
    btn.disabled = true;
    btn.textContent = '⛔ Diluar Radius Toko';
    statusEl.textContent = `❌ Anda berada di luar radius toko (Jarak: ${Math.round(distance)}m, Maks: 100m)`;
   }
  },
  (error) => {
   btn.disabled = true;
   statusEl.textContent = '🔴 Gagal mendeteksi GPS: ' + error.message;
  },
  { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
 );
}

async function startCamera(){
 if(cameraOn) return;

 const tipeAbsen = getAbsenTypeByTime();
 if(!tipeAbsen){
  alert('⛔ Sudah diluar jam absensi!');
  return;
 }
 activeTipeAbsen = tipeAbsen; // LOCK TIPE ABSEN SAAT MULAI

 try{
  document.getElementById('btnStartCamera').classList.add('hidden');
  document.getElementById('cameraStatus').textContent=`⏳ Mengaktifkan kamera - Mode: ${tipeAbsen.toUpperCase()}`;
  const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
  video.srcObject=s;await video.play();
  cameraOn=true;
  document.getElementById('cameraStatus').textContent=`🟢 Kamera aktif • Mode: ${tipeAbsen.toUpperCase()} • Arahkan wajah ke kamera`;
  setInterval(scanFace,600);
 }catch(e){
  document.getElementById('btnStartCamera').classList.remove('hidden');
  document.getElementById('cameraStatus').textContent='🔴 Gagal: '+e.message;
  setResult('Kamera gagal','error','📷','✕ Izinkan akses kamera');
  activeTipeAbsen = null;
 }
}

async function loadAI(){
 const u='https://justadudewhohacks.github.io/face-api.js/models';
 setLoading('Memuat AI Face Detector...');
 await faceapi.nets.tinyFaceDetector.loadFromUri(u);
 setLoading('Memuat Face Landmark...');
 await faceapi.nets.faceLandmark68Net.loadFromUri(u);
 setLoading('Memuat Face Recognition...');
 await faceapi.nets.faceRecognitionNet.loadFromUri(u);
}

async function loadFaces(){
 setLoading('Mengambil data wajah...');
 const {data,error}=await db.from('karyawan_wajah').select('*');
 if(error)throw new Error('Database wajah: '+error.message);
 if(!data||!data.length)throw new Error('Belum ada data wajah karyawan');
 dataKaryawan = data;
 document.getElementById('totalKaryawan').textContent=data.length;
 labeledDescriptors=data.map(k=>{
  let d=k.descriptor;
  if(typeof d==='string')d=JSON.parse(d);
  return new faceapi.LabeledFaceDescriptors(k.nama,[new Float32Array(d)]);
 });
}

function eyeRatio(points){
 const a=dist(points[1],points[5]);
 const b=dist(points[2],points[4]);
 const c=dist(points[0],points[3]);
 return (a+b)/(2*c);
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function getEAR(landmarks){
 const l=landmarks.getLeftEye();
 const r=landmarks.getRightEye();
 return (eyeRatio(l)+eyeRatio(r))/2;
}
function resetLiveness(){
 blinkClosed=false;blinkStart=0;livenessReady=false;livenessName='';
}

function checkBlink(landmarks,nama){
 const ear=getEAR(landmarks);
 if(livenessName!==nama){resetLiveness();livenessName=nama}
 if(ear<0.27){
  if(!blinkClosed){blinkClosed=true;blinkStart=Date.now()}
 }else if(blinkClosed){
  const duration=Date.now()-blinkStart;
  if(duration>=80&&duration<=1200)livenessReady=true;
  blinkClosed=false;
 }
 return livenessReady;
}

async function sudahAbsen(karyawan_id, tipe){
 const today=new Date().toISOString().split('T')[0];
 const {data,error}=await db.from('absensi').select('id').eq('karyawan_id',karyawan_id).eq('tipe',tipe).gte('jam',today).limit(1);
 if(error)throw error;
 return data&&data.length>0;
}

async function uploadFoto(nama){
 try{
  const canvas = document.createElement('canvas');
  canvas.width = 640;canvas.height = 480;
  canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
  const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.5));
  const fileName = `${nama}_${Date.now()}.jpg`;
  const {error} = await db.storage.from('absen-foto').upload(fileName, blob);
  if(error) throw error;
  return `${SUPABASE_URL}/storage/v1/object/public/absen-foto/${fileName}`
 }catch(e){
  console.error('Upload gagal, pakai foto default:', e);
  return FOTO_DEFAULT;
 }
}

async function simpanAbsen(nama){
 const karyawan = dataKaryawan.find(k => k.nama === nama);
 if(!karyawan) {
  setResult(nama,'error','❌','✕ Data karyawan tidak ada');
  return;
 }

 const tipeAbsen = activeTipeAbsen; // PAKAI YANG DI LOCK
 if(!tipeAbsen){
  setResult(nama,'error','❌','✕ Tipe absensi tidak valid');
  return;
 }

 const already=await sudahAbsen(karyawan.karyawan_id, tipeAbsen);
 if(already){
  setResult(nama,'warning','⚠️',`⚠ Sudah absen ${tipeAbsen} hari ini`);
  lastAttendanceTime=Date.now();
  return;
 }

 setResult(nama,'info','⏳','⏳ Menyimpan absensi...');

 const fotoUrl = await uploadFoto(nama);

 const {error}=await db.from('absensi').insert({
   karyawan_id: karyawan.karyawan_id,
   nama,
   jam: new Date(),
   tipe: tipeAbsen,
   foto_url: fotoUrl
 });

 if(error){
  console.error('GAGAL SIMPAN DB:', error);
  setResult(nama,'error','❌','✕ Gagal: '+error.message);
  return;
 }

 setResult(nama,'success','✅',`✓ ABSEN ${tipeAbsen.toUpperCase()} BERHASIL`);
 lastAttendanceTime=Date.now();
 lastDetectedName=nama;
 resetLiveness();
 await loadHistory();
}

async function scanFace(){
 if(!cameraOn || isScanning||!video.videoWidth)return;
 isScanning=true;
 try{
  const d=await faceapi.detectSingleFace(video,new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.4})).withFaceLandmarks().withFaceDescriptor();
  if(!d){
   resetLiveness();
   setResult('Menunggu wajah...','','👤','Arahkan wajah ke kamera');
   isScanning=false;return;
  }
  const matcher=new faceapi.FaceMatcher(labeledDescriptors,.55);
  const match=matcher.findBestMatch(d.descriptor);
  const akurasi = Math.round((1-match.distance)*100);

  if(match.label==='unknown'){
   resetLiveness();
   setResult('Wajah tidak dikenali','error','❓',`✕ Akurasi: ${akurasi}%`);
   isScanning=false;return;
  }
  const nama=match.label;
  const blink=checkBlink(d.landmarks,nama);

  if(!blink){
   setResult(nama,'info','😊',`😊 Silakan kedip 1x - Akurasi: ${akurasi}%`);
   isScanning=false;return;
  }

  setResult(nama,'success','👋',`Liveness OK! Akurasi: ${akurasi}%`);

  const now=Date.now();
  if(nama!==lastDetectedName||now-lastAttendanceTime>COOLDOWN)await simpanAbsen(nama);

 }catch(e){console.error('Scan error:',e)}
 isScanning=false;
}

async function loadHistory(){
 const today=new Date().toISOString().split('T')[0];
 const {data,error}=await db.from('absensi').select('*').gte('jam',today).order('jam',{ascending:false});
 if(error){console.error(error);return}
 document.getElementById('totalAbsen').textContent=data?data.length:0;
 const list=document.getElementById('historyList');
 if(!data||!data.length){list.innerHTML='<div class="empty">Belum ada absensi hari ini</div>';return}
 list.innerHTML=data.map(x=>{
  const initial=x.nama.trim().charAt(0).toUpperCase();
  return `<div class="item"><div class="avatar">${initial}</div><div class="item-info"><div class="item-name">${escapeHTML(x.nama)}</div><div class="item-time">🕐 ${new Date(x.jam).toLocaleTimeString('id-ID')}</div></div><div class="badge">✓ ${x.tipe||'HADIR'}</div></div>`;
 }).join('');
}

function escapeHTML(t){
 return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

async function init(){
 try{
  setLoading('Memuat sistem...');
  await loadAI();
  await loadFaces();
  await loadHistory();
  document.getElementById('loading').classList.add('hidden');
 }catch(e){
  console.error(e);setLoading('❌ '+e.message);
  setTimeout(()=>document.getElementById('loading').classList.add('hidden'),2500);
 }
}
init();
</script>
</body>
</html>
