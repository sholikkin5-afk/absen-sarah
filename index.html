<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Absen SARAHmart Anti Titip V2.2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{font-family:'Poppins', 'Segoe UI',sans-serif;background:linear-gradient(135deg, #a8e063 0%, #56ab2f 100%);text-align:center;padding:20px;margin:0;min-height:100vh}
  .card{background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);border:none;border-radius:24px;padding:25px;max-width:420px;margin:10px auto;box-shadow:0 10px 30px rgba(0,0,0,0.2);animation:fadeIn 0.5s}
  @keyframes fadeIn{from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)}}
  h2{color:#1b5e20;margin-bottom:5px;font-size:22px;font-weight:800}
  .subtitle{color:#388e3c;font-size:12px;margin-bottom:15px;font-weight:600}
  h3{margin-top:0;color:#333;font-size:16px}
  select{padding:12px 16px;font-size:16px;border-radius:12px;border:2px solid #56ab2f;width:80%;background:#f1f8e9;font-weight:bold;outline:none;transition:0.3s}
  select:focus{border-color:#1b5e20;box-shadow:0 0 0 3px rgba(86,171,47,0.2)}
  button{padding:16px 24px;border:none;border-radius:14px;background:linear-gradient(135deg,#bdbdbd,#9e9e9e);color:white;font-weight:bold;font-size:16px;margin:10px 0;width:90%;cursor:not-allowed;transition:all 0.3s;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
  button.aktif{background:linear-gradient(135deg,#ff5252,#d32f2f);cursor:pointer;transform:scale(1)}
  button.aktif:hover{transform:scale(1.03)}
  button.aktif.hijau{background:linear-gradient(135deg,#66bb6a,#43a047)}
  video, canvas{width:100%;border-radius:16px;margin-top:15px;border:3px solid #56ab2f;background:#000;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
  #status{font-weight:bold;margin-top:15px;padding:10px;border-radius:10px;font-size:14px}
  #status.ok{background:#e8f5e9;color:#2e7d32}
  #status.err{background:#ffebee;color:#c62828}
  #loading{display:none;color:#1976d2;font-weight:bold}
  .icon{font-size:24px;margin-right:8px}
</style>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
<h2>ABSEN SARAHmart</h2>
<p class="subtitle">ANTI TITIP V2.2 | GPS + WAJAH</p>
<div class="card">
  <h3>👤 Pilih Nama Karyawan</h3>
  <select id="karyawan">
    <option value="1">Tono</option>
    <option value="2">Nisa</option>
    <option value="3">Elva</option>
  </select> <br>
  <video id="video" width="400" height="300" autoplay muted playsinline></video>
  <canvas id="canvas" style="display:none"></canvas>
  <p id="status" class="err">⏳ Memuat AI Wajah + Kamera + GPS...</p>
  <p id="loading">⏳ Mengupload data, tunggu...</p>
  <button id="btnMasuk" onclick="mulaiAbsen('masuk')" disabled><span class="icon">📸</span>Absen Masuk</button>
  <button id="btnPulang" onclick="mulaiAbsen('pulang')" disabled><span class="icon">📸</span>Absen Pulang</button>
</div>
<script>
const SUPABASE_URL = 'https://bnamrfxiuxpiotrwvami.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_mPpOISFUgp2Q3N2Q4EWEfA__AuQ9agB'
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) 
const LOKASI_TOKO = {lat: -6.8881856, lng: 112.4565244} 
const RADIUS = 100
let bolehAbsen = false;
let aiSiap = false;

navigator.mediaDevices.getUserMedia({video: {width: 400, height: 300, facingMode: "user"}})
.then(s => {document.getElementById('video').srcObject = s;})

// AI LITE
Promise.all([
  faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/')
]).then(() => {
  aiSiap = true; 
  document.getElementById("status").innerHTML = "✅ AI Siap. Cek Lokasi...";
  document.getElementById("status").className = "ok";
  cekGPS();
}).catch(err => {
  document.getElementById("status").innerHTML = "❌ Gagal load AI. Pakai WiFi & Refresh";
  document.getElementById("status").className = "err";
})

function cekGPS(){
  navigator.geolocation.getCurrentPosition((pos) => {
    const jarak = hitungJarak(pos.coords.latitude, pos.coords.longitude, LOKASI_TOKO.lat, LOKASI_TOKO.lng)
    if(jarak <= RADIUS && aiSiap){
      bolehAbsen = true;
      document.getElementById("status").innerHTML = `✅ Di area toko ${jarak.toFixed(0)}m. Silahkan Absen`;
      document.getElementById("status").className = "ok";
      document.getElementById("btnMasuk").classList.add('aktif','hijau');
      document.getElementById("btnPulang").classList.add('aktif');
      document.getElementById("btnMasuk").disabled = false;
      document.getElementById("btnPulang").disabled = false
    } else {
      document.getElementById("status").innerHTML = `❌ Anda ${jarak.toFixed(0)}m dari toko. Maksimal 100m`
      document.getElementById("status").className = "err";
    }
  }, (err) => {
    document.getElementById("status").innerHTML = `❌ GPS Gagal: Aktifkan Lokasi`;
    document.getElementById("status").className = "err";
  })
}

// CEK WAJAH WAJIB
async function cekWajah(){
  const video = document.getElementById('video');
  const detections = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({inputSize: 224}));
  if(!detections){
    alert("❌ GAGAL! Wajah tidak terdeteksi.\n\n1. Hadapkan wajah ke kamera\n2. Pastikan cahaya cukup\n3. Dilarang foto plafon/tangan!");
    return false;
  }
  return true;
}

async function mulaiAbsen(tipe){
  if(!bolehAbsen) return alert("Anda di luar area toko! Maksimal 100m dari SARAHmart")
  
  const wajahValid = await cekWajah(); 
  if(!wajahValid) return;

  document.getElementById("loading").style.display = 'block';
  document.getElementById("btnMasuk").disabled = true;
  document.getElementById("btnPulang").disabled = true;

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  canvas.width = 400;canvas.height = 300;
  canvas.getContext('2d').drawImage(video, 0, 0, 400, 300);
  const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.5));
  const namaKaryawan = document.getElementById("karyawan").options[document.getElementById("karyawan").selectedIndex].text;
  const fileName = `${namaKaryawan}_${tipe}_${Date.now()}.jpg`;
  
  const {data: uploadData, error: uploadError} = await db.storage.from('absen-foto').upload(fileName, blob, {upsert: true})
  if(uploadError){
    document.getElementById("loading").style.display = 'none';
    return alert("Gagal upload foto: " + uploadError.message)
  }
  
  const fotoUrl = `${SUPABASE_URL}/storage/v1/object/public/absen-foto/${fileName}`
  const karyawan_id = document.getElementById("karyawan").value;
  const jam = new Date();
  
  const {error} = await db.from('absensi').insert([{karyawan_id: karyawan_id,nama: namaKaryawan,tipe: tipe,jam: jam,foto_url: fotoUrl}])
  document.getElementById("loading").style.display = 'none';
  
  if(!error){
    alert(`✅ Absen ${tipe.toUpperCase()} Berhasil!\n\nNama: ${namaKaryawan}\nJam: ${jam.toLocaleTimeString('id-ID')}`);
    document.getElementById("btnMasuk").disabled = false;
    document.getElementById("btnPulang").disabled = false;
    document.getElementById("btnMasuk").classList.add('aktif','hijau');
    document.getElementById("btnPulang").classList.add('aktif')
  } else {alert("Gagal simpan ke database: " + error.message)}
}

function hitungJarak(lat1, lon1, lat2, lon2){
  const R = 6371e3; 
  const φ1 = lat1 * Math.PI/180; 
  const φ2 = lat2 * Math.PI/180;
  const Δφ = (lat2-lat1) * Math.PI/180; 
  const Δλ = (lon2-lon1) * Math.PI/180;
  const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}
</script>
</body>
</html>
