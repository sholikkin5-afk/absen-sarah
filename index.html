<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Absen SARAHmart AUTO V5.2 PWA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#203a43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Absen SARAH">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1048/1048946.png">
<link rel="manifest" href="manifest.json"> <!-- FILE BARU -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
<style>
  body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);text-align:center;padding:20px;margin:0;min-height:100vh;color:white}
.card{background:rgba(255,255,255,0.1);backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,0.2);border-radius:24px;padding:25px;max-width:420px;margin:10px auto}
  h2{font-weight:800;margin-bottom:5px}.subtitle{font-size:12px;opacity:0.8}
.nama-detek{font-size:28px;font-weight:800;color:#66ff66;margin:15px 0;min-height:50px;text-shadow:0 0 10px #66ff66;transition:0.3s}
.nama-detek.sukses{transform:scale(1.1);color:#fff}
  video{width:100%;border-radius:20px;margin-top:15px;border:4px solid #66ff66;box-shadow:0 0 20px rgba(102,255,102,0.5)}
  #status{font-weight:bold;margin-top:15px;padding:12px;border-radius:12px;font-size:14px;background:rgba(0,0,0,0.3)}
  #status.ok{color:#66ff66} #status.err{color:#ff6666}
.riwayat{margin-top:20px;font-size:12px;text-align:left;background:rgba(0,0,0,0.2);padding:10px;border-radius:10px;max-height:150px;overflow-y:auto}
.modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.7);justify-content:center;align-items:center}
.modal-content{background:white;color:#333;padding:25px;border-radius:20px;width:90%;max-width:350px;text-align:center;animation:pop 0.3s}
 @keyframes pop{0%{transform:scale(0.8)}100%{transform:scale(1)}}
.modal-header{font-size:22px;font-weight:800;margin-bottom:10px}
.modal-body{font-size:14px;line-height:1.6;margin-bottom:20px}
.modal-btn{background:#56ab2f;color:white;border:none;padding:12px 30px;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer}
/* POPUP INSTALL PWA */
#installBox{display:none;position:fixed;bottom:20px;left:10px;right:10px;background:#00c853;color:white;padding:15px;border-radius:15px;z-index:9999;box-shadow:0 5px 15px rgba(0,0,0,0.3);align-items:center;justify-content:space-between}
#installBox button{margin-left:10px;padding:8px 15px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<h2>🤖 ABSEN AUTO SARAHmart</h2>
<p class="subtitle">Tinggal Ngadep Kamera - Auto Absen + Suara</p>

<!-- TOMBOL INSTALL BARU -->
<button id="btnInstallManual" style="display:none;position:fixed;top:10px;right:10px;z-index:9999;background:#00c853;color:white;border:none;padding:8px 15px;border-radius:20px;font-weight:bold">📲 Install App</button>

<div class="card">
  <div class="nama-detek" id="namaDetek">⏳ Memindai Wajah...</div>
  <video id="video" width="400" height="300" autoplay muted playsinline></video>
  <p id="status" class="err">⏳ Memuat AI + GPS...</p>
  <div class="riwayat" id="riwayatHariIni">Memuat riwayat hari ini...</div>
</div>

<div id="myModal" class="modal"><div class="modal-content"><div id="modalHeader" class="modal-header" style="color:#43a047">✅ SUKSES!</div><div id="modalBody" class="modal-body"></div><button class="modal-btn" onclick="tutupModal()">OKE</button></div></div>

<audio id="beepMasuk" src="https://actions.google.com/sounds/v1/cartoon/pop.ogg"></audio>
<audio id="beepPulang" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>

<script>
const SUPABASE_URL = 'https://fbxfoorzeojsqnzcmvic.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_Xg3DLbSsRFTsU5ZjxIylkA_JP6pUpSK'
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
const LOKASI_TOKO = {lat: -6.8881856, lng: 112.4565244}
const RADIUS = 100
let bolehAbsen = false; let aiSiap = false; let labeledDescriptors = [];
let dataKaryawan = []; let absenHariIni = []; let lagiProses = false;
let deferredPrompt; // BUAT PWA

// KODE PWA FIX V5.3
const btnInstall = document.getElementById('btnInstallManual');
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  btnInstall.style.display = 'block'; // TAMPILKAN TOMBOL
});

btnInstall.addEventListener('click', async () => {
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if(outcome === 'accepted'){ btnInstall.style.display = 'none'; }
  deferredPrompt = null;
});

// Nek wes di install, sembunyikan tombol
window.addEventListener('appinstalled', () => { btnInstall.style.display = 'none'; });

// DAFTARKAN SERVICE WORKER
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}

// KODE LAMA MU TETEP
navigator.mediaDevices.getUserMedia({video: {width: 400, height: 300, facingMode: "user"}}).then(s => {document.getElementById('video').srcObject = s;})
function showModal(judul, isi){document.getElementById('modalHeader').innerHTML = judul;document.getElementById('modalBody').innerHTML = isi;document.getElementById('myModal').style.display = 'flex';}
function tutupModal(){document.getElementById('myModal').style.display = 'none';}
function ngomong(teks){ const speech = new SpeechSynthesisUtterance(teks); speech.lang = 'id-ID'; speech.rate = 1.1; window.speechSynthesis.speak(speech); }

Promise.all([
  faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/'),
  faceapi.nets.faceLandmark68Net.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/'),
  faceapi.nets.faceRecognitionNet.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/')
]).then(async () => {
  const {data} = await db.from('karyawan_wajah').select('*');
  dataKaryawan = data;
  labeledDescriptors = await Promise.all(data.map(async k => {const descriptions = k.descriptor.map(d => new Float32Array(d)); return new faceapi.LabeledFaceDescriptors(k.nama, descriptions)}))
  aiSiap = true; cekGPS(); mulaiDeteksiWajah(); loadRiwayat();
})

function cekGPS(){navigator.geolocation.getCurrentPosition((pos) => {const jarak = hitungJarak(pos.coords.latitude, pos.coords.longitude, LOKASI_TOKO.lat, LOKASI_TOKO.lng);if(jarak <= RADIUS && aiSiap){bolehAbsen = true;document.getElementById("status").innerHTML = `✅ Di area toko ${jarak.toFixed(0)}m`;document.getElementById("status").className = "ok";}else{document.getElementById("status").innerHTML = `❌ Diluar area ${jarak.toFixed(0)}m`;document.getElementById("status").className = "err";}}, (err) => {document.getElementById("status").innerHTML = `❌ GPS Mati`})}

async function loadRiwayat(){
  const hariIni = new Date().toISOString().split('T')[0];
  const {data} = await db.from('absensi').select('*').gte('jam', hariIni).order('jam', {ascending: false});
  absenHariIni = data || [];
  let html = '<b>📋 Absen Hari Ini:</b><br>';
  if(absenHariIni.length > 0){
    absenHariIni.forEach(a => { html += `${a.nama} - ${a.tipe} jam ${new Date(a.jam).toLocaleTimeString('id-ID')}<br>` })
  } else { html += 'Belum ada yang absen' }
  document.getElementById("riwayatHariIni").innerHTML = html;
}

async function mulaiDeteksiWajah(){
  setInterval(async () => {
    if(!aiSiap ||!bolehAbsen || lagiProses) return;
    lagiProses = true;
    const detections = await faceapi.detectSingleFace(document.getElementById('video')).withFaceLandmarks().withFaceDescriptor();
    if(detections){
      const faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.6);
      const bestMatch = faceMatcher.findBestMatch(detections.descriptor);
      if(bestMatch.label!== 'unknown'){
        const karyawan = dataKaryawan.find(k => k.nama === bestMatch.label);
        document.getElementById("namaDetek").innerHTML = `✅ ${bestMatch.label}`;
        await prosesAbsenOtomatis(karyawan);
      } else {
        document.getElementById("namaDetek").innerHTML = `❌ Wajah Tidak Dikenal`;
      }
    } else {
      document.getElementById("namaDetek").innerHTML = `⏳ Memindai Wajah...`;
    }
    setTimeout(()=>{lagiProses = false}, 5000);
  }, 2000)
}

async function prosesAbsenOtomatis(karyawan){
  const jamSekarang = new Date().getHours();
  const hariIni = new Date().toISOString().split('T')[0];
  const sudahMasuk = absenHariIni.find(a => a.karyawan_id == karyawan.karyawan_id && a.tipe == 'masuk');
  const sudahPulang = absenHariIni.find(a => a.karyawan_id == karyawan.karyawan_id && a.tipe == 'pulang');
  let tipe = '';
  if(!sudahMasuk && jamSekarang >= 5 && jamSekarang <= 11){ tipe = 'masuk'; }
  else if(sudahMasuk &&!sudahPulang && jamSekarang >= 12){ tipe = 'pulang'; }
  else { return; }
  const namaEl = document.getElementById("namaDetek");
  namaEl.classList.add('sukses');
  if(tipe === 'masuk'){ document.getElementById('beepMasuk').play(); ngomong(`Selamat Datang ${karyawan.nama}`) }
  else { document.getElementById('beepPulang').play(); ngomong(`Selamat Pulang ${karyawan.nama}`) }
  setTimeout(()=>{namaEl.classList.remove('sukses')}, 1000);
  const canvas = document.createElement('canvas'); canvas.width = 400;canvas.height = 300;
  canvas.getContext('2d').drawImage(document.getElementById('video'), 0, 0, 400, 300);
  const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.5));
  const fileName = `${karyawan.nama}_${tipe}_${Date.now()}.jpg`;
  await db.storage.from('absen-foto').upload(fileName, blob);
  const fotoUrl = `${SUPABASE_URL}/storage/v1/object/public/absen-foto/${fileName}`
  await db.from('absensi').insert([{karyawan_id: karyawan.karyawan_id,nama: karyawan.nama,tipe: tipe,jam: new Date(),foto_url: fotoUrl}])
  showModal(`✅ ABSEN ${tipe.toUpperCase()} BERHASIL`, `Nama: <b>${karyawan.nama}</b><br>Jam: <b>${new Date().toLocaleTimeString('id-ID')}</b>`);
  loadRiwayat();
}

function hitungJarak(lat1, lon1, lat2, lon2){const R = 6371e3; const φ1 = lat1 * Math.PI/180; const φ2 = lat2 * Math.PI/180; const Δφ = (lat2-lat1) * Math.PI/180; const Δλ = (lon2-lon1) * Math.PI/180; const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2; const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); return R * c;}
</script>
</body></html>
