<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Absen SARAHmart</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{font-family:'Segoe UI',sans-serif;background:#f0fff4;text-align:center;padding:20px}
  .card{background:white;border:3px solid #00c853;border-radius:16px;padding:20px;max-width:400px;margin:10px auto}
  button{padding:12px 20px;border:none;border-radius:10px;background:#1976d2;color:white;font-weight:bold;font-size:16px;margin:5px;cursor:pointer}
  button:disabled{background:gray}
  select{padding:10px;border-radius:8px;font-size:16px}
</style>
</head>
<body>

<h2 style="color:#1976d2">ABSEN SARAHmart</h2>

<div class="card">
  <h3>Pilih Nama</h3>
  <select id="karyawan">
    <option value="1">Tono</option>
    <option value="2">Nisa</option>
    <option value="3">Elva</option>
  </select> <br><br>
  <button onclick="mulaiAbsen('masuk')">Absen Masuk</button>
  <button onclick="mulaiAbsen('pulang')">Absen Pulang</button>
  <p id="status">Mengecek lokasi...</p>
</div>

<script>
// KEY SAMPEAN
const SUPABASE_URL = 'https://bnamrfxiuxpiotrwvami.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_mPpOISFUgp2Q3N2Q4EWEfA__AuQ9agB'

// PENTING: supabase huruf kecil
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) 

const LOKASI_TOKO = {lat: -6.8881856, lng: 112.4565244} 
const RADIUS = 100 // 100 meter
let bolehAbsen = false;

// CEK LOKASI VERSI LENGKAP
navigator.geolocation.getCurrentPosition((pos) => {
  const jarak = hitungJarak(pos.coords.latitude, pos.coords.longitude, LOKASI_TOKO.lat, LOKASI_TOKO.lng)
  if(jarak <= RADIUS){
    bolehAbsen = true;
    document.getElementById("status").innerHTML = `✅ Di area toko. Jarak ${jarak.toFixed(0)}m`
  } else {
    document.getElementById("status").innerHTML = `❌ Anda ${jarak.toFixed(0)}m dari toko. Dekat dulu`
  }
}, (err) => {
  document.getElementById("status").innerHTML = `❌ Gagal: ${err.message}. Aktifkan GPS`
})

async function mulaiAbsen(tipe){
  if(!bolehAbsen) return alert("Anda di luar area toko!")
  
  const karyawan_id = document.getElementById("karyawan").value;
  const jam = new Date();
  
  const {data, error} = await db.from('absensi').insert([{
    karyawan_id: karyawan_id,
    tipe: tipe,
    jam: jam,
    lat: LOKASI_TOKO.lat,
    lng: LOKASI_TOKO.lng
  }]).select()
  
  if(!error){
    alert(`✅ Absen ${tipe} Berhasil jam ${jam.toLocaleTimeString('id-ID')}`)
  } else {
    alert("Gagal: " + error.message)
  }
}

function hitungJarak(lat1, lon1, lat2, lon2){
  const R = 6371e3; const φ1 = lat1*Math.PI/180; const φ2 = lat2*Math.PI/180;
  const Δφ = (lat2-lat1)*Math.PI/180; const Δλ = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
</script>
</body>
</html>
