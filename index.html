<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Absen SARAHmart Anti Titip V2.4</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{font-family:'Poppins', 'Segoe UI',sans-serif;background:linear-gradient(135deg, #a8e063 0%, #56ab2f 100%);text-align:center;padding:20px;margin:0;min-height:100vh}
  .card{background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);border:none;border-radius:24px;padding:25px;max-width:420px;margin:10px auto;box-shadow:0 10px 30px rgba(0,0,0,0.2)}
  h2{color:#1b5e20;margin-bottom:5px;font-size:22px;font-weight:800}
  .subtitle{color:#388e3c;font-size:12px;margin-bottom:15px;font-weight:600}
  h3{margin-top:0;color:#333;font-size:16px}
  select{padding:12px 16px;font-size:16px;border-radius:12px;border:2px solid #56ab2f;width:80%;background:#f1f8e9;font-weight:bold;outline:none}
  button{padding:16px 24px;border:none;border-radius:14px;background:linear-gradient(135deg,#bdbdbd,#9e9e9e);color:white;font-weight:bold;font-size:16px;margin:10px 0;width:90%;cursor:not-allowed;transition:all 0.3s}
  button.aktif{background:linear-gradient(135deg,#ff5252,#d32f2f);cursor:pointer}
  button.aktif.hijau{background:linear-gradient(135deg,#66bb6a,#43a047)}
  video, canvas{width:100%;border-radius:16px;margin-top:15px;border:3px solid #56ab2f;background:#000}
  #status{font-weight:bold;margin-top:15px;padding:10px;border-radius:10px;font-size:14px}
  #status.ok{background:#e8f5e9;color:#2e7d32}
  #status.err{background:#ffebee;color:#c62828}
  #loading{display:none;color:#1976d2;font-weight:bold}
  .modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.6);backdrop-filter:blur(5px);justify-content:center;align-items:center}
  .modal-content{background:white;padding:25px;border-radius:20px;width:90%;max-width:350px;text-align:left}
  .modal-header{font-size:18px;font-weight:800;margin-bottom:10px}
  .modal-header.err{color:#d32f2f} .modal-header.ok{color:#43a047}
  .modal-body{font-size:14px;color:#555;line-height:1.6;margin-bottom:20px}
  .modal-btn{background:linear-gradient(135deg,#56ab2f,#43a047);color:white;border:none;padding:12px;width:100%;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer}
</style>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
<h2>ABSEN SARAHmart</h2>
<p class="subtitle">ANTI TITIP V2.4 | GPS + FACE RECOGNITION</p>
<div class="card">
  <h3>👤 Pilih Nama Karyawan</h3>
  <select id="karyawan">
    <option value="1">Tono</option>
    <option value="2">Nisa</option>
    <option value="3">Elva</option>
  </select> <br>
  <video id="video" width="400" height="300" autoplay muted playsinline></video>
  <canvas id="canvas" style="display:none"></canvas>
  <p id="status" class="err">⏳ Memuat AI + Kamera + GPS...</p>
  <p id="loading">⏳ Mengupload data, tunggu...</p>
  <button id="btnDaftar" onclick="daftarWajah()" style="background:linear-gradient(135deg,#42a5f5,#1e88e5);cursor:pointer">📝 Daftar Wajah Pertama Kali</button>
  <button id="btnMasuk" onclick="mulaiAbsen('masuk')" disabled><span>📸</span>Absen Masuk</button>
  <button id="btnPulang" onclick="mulaiAbsen('pulang')" disabled><span>📸</span>Absen Pulang</button>
</div>

<div id="myModal" class="modal"><div class="modal-content"><div id="modalHeader" class="modal-header err">❌ GAGAL!</div><div id="modalBody" class="modal-body"></div><button class="modal-btn" onclick="tutupModal()">OKE</button></div></div>

<script>
const SUPABASE_URL = 'https://bnamrfxiuxpiotrwvami.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_mPpOISFUgp2Q3N2Q4EWEfA__AuQ9agB'
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) 
const LOKASI_TOKO = {lat: -6.8881856, lng: 112.4565244} 
const RADIUS = 100
let bolehAbsen = false;
let aiSiap = false;
let labeledDescriptors = [];

navigator.mediaDevices.getUserMedia({video: {width: 400, height: 300, facingMode: "user"}})
.then(s => {document.getElementById('video').srcObject = s;})

function showModal(tipe, judul, isi){document.getElementById('modalHeader').className = `modal-header ${tipe}`;document.getElementById('modalHeader').innerHTML = judul;document.getElementById('modalBody').innerHTML = isi;document.getElementById('myModal').style.display = 'flex';}
function tutupModal(){document.getElementById('myModal').style.display = 'none';}

// LOAD AI + DATA WAJAH DARI DB
Promise.all([
  faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/'),
  faceapi.nets.faceLandmark68Net.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/'),
  faceapi.nets.faceRecognitionNet.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/')
]).then(async () => {
  aiSiap = true; 
  await loadLabeledImages(); // LOAD DATA WAJAH KARYAWAN
  document.getElementById("status").innerHTML = "✅ AI Siap. Cek Lokasi...";
  document.getElementById("status").className = "ok";
  cekGPS();
})

async function loadLabeledImages(){
  const {data, error} = await db.from('karyawan_wajah').select('*');
  if(error) return;
  labeledDescriptors = await Promise.all(data.map(async k => {
    const descriptions = k.descriptor.map(d => new Float32Array(d));
    return new faceapi.LabeledFaceDescriptors(k.nama, descriptions)
  }))
}

function cekGPS(){navigator.geolocation.getCurrentPosition((pos) => {const jarak = hitungJarak(pos.coords.latitude, pos.coords.longitude, LOKASI_TOKO.lat, LOKASI_TOKO.lng);if(jarak <= RADIUS && aiSiap){bolehAbsen = true;document.getElementById("status").innerHTML = `✅ Di area toko ${jarak.toFixed(0)}m. Silahkan Absen`;document.getElementById("status").className = "ok";document.getElementById("btnMasuk").classList.add('aktif','hijau');document.getElementById("btnPulang").classList.add('aktif');document.getElementById("btnMasuk").disabled = false;document.getElementById("btnPulang").disabled = false}else{document.getElementById("status").innerHTML = `❌ Anda ${jarak.toFixed(0)}m dari toko. Maksimal 100m`;document.getElementById("status").className = "err";}}, (err) => {showModal('err','❌ GPS GAGAL','Aktifkan GPS & Izin Lokasi')})}

// GANTI BAGIAN daftarWajah() IKI AE
async function daftarWajah(){
  const nama = document.getElementById("karyawan").options[document.getElementById("karyawan").selectedIndex].text;
  const detections = await faceapi.detectSingleFace(document.getElementById('video'), new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
  if(!detections) return showModal('err','❌ GAGAL','Wajah tidak terdeteksi saat daftar');
  
  const descriptor = Array.from(detections.descriptor); 
  const {error} = await db.from('karyawan_wajah').upsert([{karyawan_id: document.getElementById("karyawan").value, nama: nama, descriptor: [descriptor]}]);
  
  if(error){ 
    console.log(error); // IKI PENTING KANGGO DEBUG
    return showModal('err','❌ GAGAL SIMPAN DB',error.message + "\n\nCek RLS Supabase mu!") 
  }
  await loadLabeledImages();
  showModal('ok','✅ BERHASIL','Data wajah ' + nama + ' sudah tersimpan. Sekarang bisa absen');
}

// 2. CEK WAJAH SAAT ABSEN
async function cekWajahCocok(){
  const namaDipilih = document.getElementById("karyawan").options[document.getElementById("karyawan").selectedIndex].text;
  const detections = await faceapi.detectSingleFace(document.getElementById('video'), new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
  if(!detections) {showModal('err','❌ WAJAH TIDAK TERDETEKSI','Hadapkan wajah ke kamera'); return false;}
  
  const faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.6); // 0.6 = tingkat kemiripan
  const bestMatch = faceMatcher.findBestMatch(detections.descriptor);
  
  if(bestMatch.label === 'unknown' || bestMatch.label !== namaDipilih){
    showModal('err','❌ WAJAH TIDAK COCOK',`Wajah ini bukan ${namaDipilih}!\nTerdeteksi: ${bestMatch.label}\nDilarang titip absen!`);
    return false;
  }
  return true;
}

async function mulaiAbsen(tipe){
  if(!bolehAbsen) return showModal('err','❌ DILUAR AREA','Anda berada di luar area toko! Maksimal 100m')
  if(labeledDescriptors.length === 0) return showModal('err','❌ BELUM DAFTAR','Silahkan pencet tombol "Daftar Wajah" terlebih dahulu');
  
  const wajahCocok = await cekWajahCocok(); 
  if(!wajahCocok) return;

  document.getElementById("loading").style.display = 'block';
  const canvas = document.getElementById('canvas'); canvas.width = 400;canvas.height = 300;
  canvas.getContext('2d').drawImage(document.getElementById('video'), 0, 0, 400, 300);
  const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.5));
  const namaKaryawan = document.getElementById("karyawan").options[document.getElementById("karyawan").selectedIndex].text;
  const fileName = `${namaKaryawan}_${tipe}_${Date.now()}.jpg`;
  
  const {error: uploadError} = await db.storage.from('absen-foto').upload(fileName, blob, {upsert: true})
  if(uploadError){document.getElementById("loading").style.display = 'none'; return showModal('err','❌ GAGAL UPLOAD',uploadError.message)}
  
  const fotoUrl = `${SUPABASE_URL}/storage/v1/object/public/absen-foto/${fileName}`
  const {error} = await db.from('absensi').insert([{karyawan_id: document.getElementById("karyawan").value,nama: namaKaryawan,tipe: tipe,jam: new Date(),foto_url: fotoUrl}])
  document.getElementById("loading").style.display = 'none';
  
  if(!error){showModal('ok',`✅ ABSEN ${tipe.toUpperCase()} BERHASIL!`,`Nama: <b>${namaKaryawan}</b><br>Jam: <b>${new Date().toLocaleTimeString('id-ID')}</b>`)} 
  else {showModal('err','❌ GAGAL SIMPAN',error.message)}
}

function hitungJarak(lat1, lon1, lat2, lon2){const R = 6371e3; const φ1 = lat1 * Math.PI/180; const φ2 = lat2 * Math.PI/180; const Δφ = (lat2-lat1) * Math.PI/180; const Δλ = (lon2-lon1) * Math.PI/180; const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2; const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); return R * c;}
</script>
</body>
</html>
