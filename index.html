<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Absen SARAHmart Anti Titip V2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
  body{font-family:'Segoe UI',sans-serif;background:#f0fff4;text-align:center;padding:20px;margin:0}
  .card{background:white;border:3px solid #00c853;border-radius:16px;padding:20px;max-width:400px;margin:10px auto;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
  h2{color:#1976d2;margin-bottom:10px}
  h3{margin-top:0}
  select{padding:8px 12px;font-size:16px;border-radius:8px;border:2px solid #00c853}
  button{padding:14px 24px;border:none;border-radius:10px;background:gray;color:white;font-weight:bold;font-size:16px;margin:8px;width:90%;cursor:not-allowed}
  button.aktif{background:#d32f2f;cursor:pointer} /* Abang */
  button.aktif.hijau{background:#00c853} /* Ijo gawe masuk */
  video, canvas{width:100%;border-radius:10px;margin-top:10px;border:2px solid #00c853;background:#000}
  #status{font-weight:bold;margin-top:10px}
  #loading{display:none;color:#1976d2;font-weight:bold}
</style>
</head>
<body>
<h2>ABSEN SARAHmart ANTI TITIP V2</h2>
<div class="card">
  <h3>Pilih Nama</h3>
  <select id="karyawan">
    <option value="1">Tono</option>
    <option value="2">Nisa</option>
    <option value="3">Elva</option>
  </select> <br>
  <video id="video" width="400" height="300" autoplay muted playsinline></video>
  <canvas id="canvas" style="display:none"></canvas>
  <p id="status">⏳ Memuat AI Wajah + Kamera + GPS...</p>
  <p id="loading">⏳ Mengupload data, tunggu...</p>
  <button id="btnMasuk" onclick="mulaiAbsen('masuk')" disabled>📸 Absen Masuk</button>
  <button id="btnPulang" onclick="mulaiAbsen('pulang')" disabled>📸 Absen Pulang</button>
</div>
<script>
const SUPABASE_URL = 'https://bnamrfxiuxpiotrwvami.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_mPpOISFUgp2Q3N2Q4EWEfA__AuQ9agB'
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) 
const LOKASI_TOKO = {lat: -6.8881856, lng: 112.4565244} 
const RADIUS = 100 // 0m - 100m
let bolehAbsen = false;
let aiSiap = false;

// 1. NYALAKAN KAMERA
navigator.mediaDevices.getUserMedia({video: {width: 400, height: 300, facingMode: "user"}})
.then(s => {document.getElementById('video').srcObject = s;})
.catch(err => {document.getElementById("status").innerHTML = `❌ Kamera Gagal: ${err.message}`});

// 2. LOAD AI WAJAH DULU, KEMUDIAN CEK GPS
Promise.all([
  faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/weights/')
]).then(() => {
  aiSiap = true; 
  document.getElementById("status").innerHTML = "✅ AI Siap. Cek Lokasi...";
  cekGPS(); 
}).catch(err => {
  document.getElementById("status").innerHTML = `❌ Gagal memuat AI Wajah`;
});

// 3. FUNGSI CEK GPS
function cekGPS(){
  navigator.geolocation.getCurrentPosition((pos) => {
    const jarak = hitungJarak(pos.coords.latitude, pos.coords.longitude, LOKASI_TOKO.lat, LOKASI_TOKO.lng)
    if(jarak <= RADIUS && aiSiap){
      bolehAbsen = true;
      document.getElementById("status").innerHTML = `✅ Di area toko ${jarak.toFixed(0)}m. Silahkan Absen`;
      document.getElementById("btnMasuk").classList.add('aktif','hijau');
      document.getElementById("btnPulang").classList.add('aktif');
      document.getElementById("btnMasuk").disabled = false;
      document.getElementById("btnPulang").disabled = false;
    } else {
      document.getElementById("status").innerHTML = `❌ Anda ${jarak.toFixed(0)}m dari toko. Maksimal 100m`;
    }
  }, (err) => {
    document.getElementById("status").innerHTML = `❌ GPS Gagal: ${err.message}. Aktifkan GPS`;
  }, {enableHighAccuracy: true, timeout: 10000});
}

// 4. FUNGSI CEK WAJAH
async function cekWajah(){
  const video = document.getElementById('video');
  const detections = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions());
  if(!detections){
    alert("❌ GAGAL! Wajah tidak terdeteksi.\nPastikan wajah asli ada di depan kamera dan cahaya cukup");
    return false;
  }
  return true;
}

async function mulaiAbsen(tipe){
  if(!bolehAbsen) return alert("Anda di luar area toko! Maksimal 100m dari SARAHmart");
  
  const wajahValid = await cekWajah(); 
  if(!wajahValid) return;

  document.getElementById("loading").style.display = 'block';
  document.getElementById("btnMasuk").disabled = true;
  document.getElementById("btnPulang").disabled = true;
  document.getElementById("btnMasuk").classList.remove('aktif','hijau');
  document.getElementById("btnPulang").classList.remove('aktif');

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  canvas.width = 400; canvas.height = 300;
  canvas.getContext('2d').drawImage(video, 0, 0, 400, 300);
  const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.4));
  const namaKaryawan = document.getElementById("karyawan").options[document.getElementById("karyawan").selectedIndex].text;
  const fileName = `${namaKaryawan}_${tipe}_${Date.now()}.jpg`;
  
  const {data: uploadData, error: uploadError} = await db.storage.from('absen-foto').upload(fileName, blob, {upsert: true});
  if(uploadError){
    document.getElementById("loading").style.display = 'none';
    document.getElementById("btnMasuk").disabled = false;
    document.getElementById("btnPulang").disabled = false;
    document.getElementById("btnMasuk").classList.add('aktif','hijau');
    document.getElementById("btnPulang").classList.add('aktif');
    return alert("Gagal upload foto: " + uploadError.message);
  }
  
  const fotoUrl = `${SUPABASE_URL}/storage/v1/object/public/absen-foto/${fileName}`;
  const karyawan_id = document.getElementById("karyawan").value;
  const jam = new Date();
  
  const {error} = await db.from('absensi').insert([{karyawan_id: karyawan_id, nama: namaKaryawan, tipe: tipe, jam: jam, foto_url: fotoUrl}]);
  document.getElementById("loading").style.display = 'none';
  
  if(!error){
    alert(`✅ Absen ${tipe.toUpperCase()} Berhasil!\nNama: ${namaKaryawan}\nJam: ${jam.toLocaleTimeString('id-ID')}`);
    document.getElementById("btnMasuk").disabled = false;
    document.getElementById("btnPulang").disabled = false;
    document.getElementById("btnMasuk").classList.add('aktif','hijau');
    document.getElementById("btnPulang").classList.add('aktif');
  } else {
    alert("Gagal simpan ke database: " + error.message);
    document.getElementById("btnMasuk").disabled = false;
    document.getElementById("btnPulang").disabled = false;
    document.getElementById("btnMasuk").classList.add('aktif','hijau');
    document.getElementById("btnPulang").classList.add('aktif');
  }
}

function hitungJarak(lat1, lon1, lat2, lon2){
  const R = 6371e3; 
  const φ1 = lat1 * Math.PI/180; 
  const φ2 = lat2 * Math.PI/180;
  const Δφ = (lat2-lat1) * Math.PI/180; 
  const Δλ = (lon2-lon1) * Math.PI/180;
  const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}
</script>
</body>
</html>
